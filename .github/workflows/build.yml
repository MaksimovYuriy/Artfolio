name: CI and publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
        
      - name: Run backend tests
        working-directory: backend
        run: go test -race ./...

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_DB: artfolio_test
          POSTGRES_USER: artfolio_test
          POSTGRES_PASSWORD: artfolio_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U artfolio_test -d artfolio_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      
      - name: Run integration tests
        working-directory: backend
        env:
          ARTFOLIO_TEST_DATABASE_URL: postgres://artfolio_test:artfolio_test@127.0.0.1:55432/artfolio_test?sslmode=disable
        run: go test -tags=integration ./integration-tests
  
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  publish:
    needs:
      - backend-unit
      - backend-integration
      - frontend-checks

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/maksimovyuriy/artfolio-frontend:latest
      
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/maksimovyuriy/artfolio-backend:latest
