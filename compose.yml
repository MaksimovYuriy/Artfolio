services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - artwork_media:/srv/media:ro
    depends_on:
      - frontend
      - backend
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/maksimovyuriy/artfolio-frontend:latest
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      - backend
    logging: *default-logging
  
  backend:
    image: ghcr.io/maksimovyuriy/artfolio-backend:latest
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.25
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - artwork_media:/var/lib/artfolio/media
    logging: *default-logging

  migrate:
    image: ghcr.io/maksimovyuriy/artfolio-backend:latest
    command: ["./artfolio-migrate"]
    env_file:
      - .env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  postgres:
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 3s
      timeout: 3s
      retries: 5
    shm_size: 128mb
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

  key:
    image: ghcr.io/maksimovyuriy/artfolio-backend:latest
    command: ["./artfolio-key"]
    env_file:
      - .env
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  artwork_media:
