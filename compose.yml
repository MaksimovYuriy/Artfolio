services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - artwork_media:/srv/media:ro
    depends_on:
      - frontend
      - backend
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/maksimovyuriy/artfolio-frontend:latest
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      - backend
    logging: *default-logging
  
  backend:
    image: ghcr.io/maksimovyuriy/artfolio-backend:latest
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.25
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - artwork_media:/var/lib/artfolio/media
    logging: *default-logging

  kafka:
    image: apache/kafka:4.2.1
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 15s
      retries: 12
      start_period: 20s
    mem_limit: 768m
    cpus: 0.75
    logging: *default-logging

  kafka-init:
    image: apache/kafka:4.2.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CONTACT_MESSAGE_SUBMITTED_TOPIC: ${KAFKA_CONTACT_MESSAGE_SUBMITTED_TOPIC:-contact-message.submitted.v1}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_TOPIC_RETENTION_MS: ${KAFKA_TOPIC_RETENTION_MS:-604800000}
    command:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic "$${KAFKA_CONTACT_MESSAGE_SUBMITTED_TOPIC}" \
          --partitions "$${KAFKA_TOPIC_PARTITIONS}" \
          --replication-factor 1
        /opt/kafka/bin/kafka-configs.sh \
          --bootstrap-server kafka:19092 \
          --alter \
          --entity-type topics \
          --entity-name "$${KAFKA_CONTACT_MESSAGE_SUBMITTED_TOPIC}" \
          --add-config "cleanup.policy=delete,retention.ms=$${KAFKA_TOPIC_RETENTION_MS}"
    logging: *default-logging

  migrate:
    image: ghcr.io/maksimovyuriy/artfolio-backend:latest
    command: ["./artfolio-migrate"]
    env_file:
      - .env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  postgres:
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 3s
      timeout: 3s
      retries: 5
    shm_size: 128mb
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

  key:
    image: ghcr.io/maksimovyuriy/artfolio-backend:latest
    command: ["./artfolio-key"]
    env_file:
      - .env
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
  
  mail-service:
    image: ghcr.io/maksimovyuriy/artfolio-mail-service:latest
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  artwork_media:
  kafka_data:
