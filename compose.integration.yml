name: artfolio-integration

services:
  postgres:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: artfolio_test
      POSTGRES_USER: artfolio_test
      POSTGRES_PASSWORD: artfolio_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artfolio_test -d artfolio_test"]
      interval: 1s
      timeout: 3s
      retries: 15
    restart: "no"
